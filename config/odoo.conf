[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir = /var/lib/odoo
; admin_passwd va db credentials duoc truyen qua environment variables
; trong docker-compose.prod.yml (doc tu file .env)
proxy_mode = True
workers = 2
max_cron_threads = 1
limit_time_cpu = 120
limit_time_real = 240
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
list_db = True
